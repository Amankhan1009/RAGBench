name: RAGBench CI/CD Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Unit & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: |
          ruff check src/ tests/ scripts/

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENCRYPTION_KEY: "ci-test-encryption-key-for-testing"
        run: |
          pytest tests/ -k "not test_regression_api_endpoint" -v

      - name: Run Standalone CI Regression Quality Gate
        env:
          PYTHONPATH: src
        run: |
          python scripts/check_regression.py

  frontend-build:
    name: Next.js Frontend Compilation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-publish-backend:
    name: Build & Push Backend Docker Image
    needs: [backend-quality-and-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragbench-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ragbench-backend:${{ github.sha }}

  docker-publish-frontend:
    name: Build & Push Frontend Docker Image
    needs: [frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragbench-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ragbench-frontend:${{ github.sha }}

  done:
    name: CI/CD Done
    needs: [backend-quality-and-tests, frontend-build, docker-publish-backend, docker-publish-frontend]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Pipeline Verification Complete
        run: echo "All CI/CD checks and Docker builds completed successfully."