name: RAGBench CI/CD Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Unit & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: |
          ruff check src/ tests/ scripts/

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENCRYPTION_KEY: "ci-test-encryption-key-for-testing"
        run: |
          pytest tests/test_agent_evaluator.py tests/test_auth.py tests/test_jwt.py tests/test_byok.py tests/test_tracing.py tests/test_security.py tests/test_providers.py tests/test_deterministic_evaluators.py tests/test_llm_judge_evaluators.py tests/test_groq.py tests/test_regression.py -k "not test_regression_api_endpoint" -v

      - name: Run Standalone CI Regression Quality Gate
        env:
          PYTHONPATH: src
        run: |
          python scripts/check_regression.py

  frontend-build:
    name: Next.js Frontend Compilation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-publish:
    name: Build & Push Docker Images to Docker Hub
    needs: [backend-quality-and-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragbench-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ragbench-backend:${{ github.sha }}

      # 2. Build & Push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragbench-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ragbench-frontend:${{ github.sha }}